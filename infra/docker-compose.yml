services:
  mongodb:
    image: mongo:7
    container_name: vehicle-datasource
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb
      MONGO_INITDB_ROOT_PASSWORD: mongodb
      MONGO_INITDB_DATABASE: vehicle_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --eval ''db.runCommand("ping").ok'' --quiet']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
